name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "Using custom secret keystore."
            echo "signing_key=${{ secrets.SIGNING_KEY }}" >> $GITHUB_OUTPUT
            echo "alias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "store_password=${{ secrets.KEY_STORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_password=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "Generating automatic release keystore in GitHub Actions..."
            keytool -genkeypair -v \
              -keystore auto_release.jks \
              -alias vaultkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "VaultMonitor2026Pass" \
              -keypass "VaultMonitor2026Pass" \
              -dname "CN=VaultMonitor, OU=App, O=HyperVault, L=Online, ST=Online, C=US"

            BASE64_KEY=$(base64 -w 0 auto_release.jks)
            echo "signing_key=${BASE64_KEY}" >> $GITHUB_OUTPUT
            echo "alias=vaultkey" >> $GITHUB_OUTPUT
            echo "store_password=VaultMonitor2026Pass" >> $GITHUB_OUTPUT
            echo "key_password=VaultMonitor2026Pass" >> $GITHUB_OUTPUT
          fi

      - name: Sign Release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ steps.keystore.outputs.signing_key }}
          alias: ${{ steps.keystore.outputs.alias }}
          keyStorePassword: ${{ steps.keystore.outputs.store_password }}
          keyPassword: ${{ steps.keystore.outputs.key_password }}

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Monitor-Release-Signed-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}


